services:
  pi:
    build:
      context: .
    image: local/pi-web-ui:latest
    container_name: pi
    restart: unless-stopped

    # Ollama stays in its existing, separate Docker project and is reached
    # through the host-published port 11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Keep the web UI local to this machine.
    ports:
      - "127.0.0.1:${PI_WEB_PORT:-8787}:8787"

    environment:
      PI_WHITERABBIT_THINKING_LEVEL: ${PI_WHITERABBIT_THINKING_LEVEL:-medium}
      PI_WHITERABBIT_REASONING: ${PI_WHITERABBIT_REASONING:-true}
      PI_ATOMIC_RESULTS_FIXED_PROVIDER_TOOLS: "true"
      PI_NATIVE_SERVICES_PATH: /opt/pi-extensions/pi-native-services
      PI_CODING_AGENT_DIR: /home/pi/.pi/agent
      PI_WEB_DATA_DIR: /home/pi/.pi-web
      PI_WEB_CWD: /workspace
      PI_WEB_HOST: 0.0.0.0
      PI_WEB_PORT: 8787
      PI_WEB_TOKEN: ${PI_WEB_TOKEN:-}
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PI_MODEL_CONTEXT_CAP: "32768"
      PI_OLLAMA_CONTEXT_CAP: "32768"
      PI_CREATE_32K_ALIASES: "true"
      PI_OLLAMA_MAX_TOKENS: ${PI_OLLAMA_MAX_TOKENS:-4096}
      PI_OLLAMA_DISCOVERY_RETRY_SECONDS: ${PI_OLLAMA_DISCOVERY_RETRY_SECONDS:-30}
      PI_OLLAMA_HIDE_ALIAS_SOURCES: ${PI_OLLAMA_HIDE_ALIAS_SOURCES:-true}
      PI_WEB_MANAGED: "1"
      PI_WEB_ENGINE: pi

    volumes:
      # Host-visible durable state. These directories are created by scripts/init.sh.
      - ./data/pi:/home/pi/.pi
      - ./data/web:/home/pi/.pi-web
      # Pi models.json is generated from Ollama on every container start.
      # Keep only small version-controlled per-model overrides here.
      - ./config/models-overrides.json:/etc/pi/models-overrides.json:ro
      - ./config/models-fallback.json:/etc/pi/models-fallback.json:ro
      - ./config/mcp.json:/home/pi/.pi/agent/mcp.json:ro
      - ./config/APPEND_SYSTEM.md:/home/pi/.pi/agent/APPEND_SYSTEM.md:ro
      # Dedicated working directory; access to the host goes through System MCP.
      - ./workspace:/workspace
      - ./config/skills:/home/pi/.pi/agent/skills:ro

    networks:
      - ai-local

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

networks:
  ai-local:
    external: true
    name: ai-local
